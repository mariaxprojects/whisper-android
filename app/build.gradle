plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.bpdq.whisper'
    compileSdk 35

    defaultConfig {
        applicationId "com.bpdq.whisper"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            // The 365 MB model needs a 64-bit phone; 32-bit and x86 builds are skipped.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // Native code is always built optimized, even for debug APKs.
                arguments "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_STL=c++_static"
            }
        }
    }

    signingConfigs {
        // A fixed key so new builds install over old ones (keeping the downloaded model).
        // Fine for personal sideloading; use your own private key if you distribute the app.
        sideload {
            storeFile file('sideload.keystore')
            storePassword 'bpdqwhisper'
            keyAlias 'sideload'
            keyPassword 'bpdqwhisper'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
            externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=Release" } }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packaging {
        jniLibs { useLegacyPackaging false }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
