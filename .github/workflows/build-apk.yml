name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The patched whisper.cpp tree (downloaded + patched at build time) is cached between runs.
      - uses: actions/cache@v4
        with:
          path: app/.native-deps
          key: native-deps-${{ hashFiles('app/src/main/cpp/prepare_whisper.cmake', 'app/src/main/cpp/bpdq2_fast.inc') }}

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Check native library
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep libbpdqwhisper.so
          cp "$APK" BPDQWhisper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BPDQWhisper-apk
          path: BPDQWhisper.apk

      # A release page is easier to open on a phone than an Actions artifact (no login, no zip).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Whisper 2-bit, build ${{ github.run_number }}
          body: |
            Install BPDQWhisper.apk on a 64-bit Android phone (Android 9+).
            On first launch the app downloads the 365 MB model from Hugging Face.
          files: BPDQWhisper.apk
